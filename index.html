.slider input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent}

.slider input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--user),var(--both),var(--model))}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.slider input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.slider.untouched input[type=range]::-webkit-slider-thumb{border-style:dashed;opacity:.6}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font:500 13px/1 var(--f-ui);background:var(--surface);color:var(--ink)}

      el("a", { class: "btn", href: formUrl, target: "_blank", rel: "noopener" }, "Open the form with my answers"),
      el("p", { class: "hint", text: "If the form won't load, copy your answers and send them to Hirona." }), pre,

        catch (e) { const rg = document.createRange(); rg.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); ev.currentTarget.textContent = "Selected: copy it"; } } }, "Copy my answers")));

/* Owner-only live results: per group, the two versions side by side. */
const Q = [["model","Model","var(--model)"],["both","Both","var(--both)"],["user","Person","var(--user)"],["neither","Neither","var(--ink3)"],["cant","Can't tell","var(--line)"]];
function quad(x) { if (x.model === "cant" || x.user === "cant") return "cant"; if (x.model === "yes") return x.user === "yes" ? "both" : "model"; return x.user === "yes" ? "user" : "neither"; }
let unsub = null, docs = [];
function renderResults() {
  const box = el("div", { class: "res" });
  app.replaceChildren(header("Results · live"), el("h2", { text: "What the room said" }),
    el("div", { class: "key" }, ...Q.map(([k, lab, c]) => el("span", {}, el("b", { style: "background:" + c }), lab))), box);
  if (!db) { box.append(el("p", { class: "hint", text: "Results need the shared store, which isn't available in this view." })); return; }
  const stackFor = ans => { const st = el("div", { class: "stack" }); for (const [k, lab, c] of Q) { const n = ans.filter(x => quad(x) === k).length;
    if (n) st.append(el("span", { style: "width:" + (100 * n / ans.length) + "%;background:" + c, title: lab + ": " + n })); } return st; };
  const summary = ans => { if (!ans.length) return "no answers yet"; const cnt = {}; ans.forEach(x => cnt[quad(x)] = (cnt[quad(x)] || 0) + 1);
    const top = Object.entries(cnt).sort((p, q) => q[1] - p[1])[0]; const lab = Q.find(q => q[0] === top[0])[1];
    const pred = ans.filter(x => x.predicted); const ps = pred.length ? " · predicted: " + pred.map(x => x.predicted).join(", ") : "";
    return ans.length + " answers · most: " + lab + " (" + Math.round(100 * top[1] / ans.length) + "%)" + ps; };
  const paint = () => {
    const real = docs.filter(d => !d.test && d.version === "v4"), all = real.flatMap(d => d.answers || []);
    box.replaceChildren(el("p", { class: "small", text: real.length + " people · " + (docs.length - real.length) + " test runs hidden" }));
    for (const g of GROUPS) {
      const it0 = ITEMS[g[0]], vs = el("div", { class: "vs" });
      for (const id of g) { const it = ITEMS[id], ans = all.filter(x => x.item === id);
        const ch = {}; ans.forEach(x => (x.changed || []).forEach(k => ch[k] = (ch[k] || 0) + 1));
        const noticed = Object.entries(ch).sort((p, q) => q[1] - p[1]).map(([k, n]) => k + " " + n).join(", ");
        vs.append(el("div", { class: "vbox" }, el("strong", { text: it.note || it.version }), stackFor(ans), el("span", { class: "small", text: summary(ans) }),
          el("span", { class: "small", text: "noticed: " + (noticed || "–") }))); }
      box.append(el("div", { class: "it" }, el("span", { class: "eyebrow", text: GROUP_NAME[it0.group] || "" }), vs));
    }
    const pr = all.filter(x => x.item === "pair_source_clue");
    if (pr.length) { const cnt = k => pr.filter(x => x.choice === k).length;
      box.append(el("div", { class: "it" }, el("span", { class: "eyebrow", text: GROUP_NAME.source_clue }),
        el("span", { class: "small", text: "model more at fault in: " + ITEMS[PAIR[0]].note + " " + cnt(PAIR[0]) + " · " + ITEMS[PAIR[1]].note + " " + cnt(PAIR[1]) +
          " · about the same " + cnt("same") + " · can't tell " + cnt("cant") }),
        el("span", { class: "small", text: "said the original differs: " + pr.filter(x => x.differs.includes("original")).length + " of " + pr.length }))); }
    const fmt = f => all.filter(x => x.format === f && x.order > 0 && !x.item.startsWith("pair"));
    box.append(el("div", { class: "it" }, el("span", { class: "eyebrow", text: "Input format" }),
      el("div", { class: "vs" }, el("div", { class: "vbox" }, el("strong", { text: "Two questions" }), stackFor(fmt("twoq")), el("span", { class: "small", text: fmt("twoq").length + " answers · median " + med(fmt("twoq")) + " s" })),
        el("div", { class: "vbox" }, el("strong", { text: "One-tap grid" }), stackFor(fmt("grid")), el("span", { class: "small", text: fmt("grid").length + " answers · median " + med(fmt("grid")) + " s" })))));
    const json = JSON.stringify(docs);
    box.append(el("button", { class: "btn ghost", onclick: async ev => { try { await navigator.clipboard.writeText(json); ev.currentTarget.textContent = "Copied"; } catch (e) { ev.currentTarget.textContent = "Copy failed: ask Claude to read the results"; } } }, "Copy all answers (JSON)"));
  };

}
function med(xs) { if (!xs.length) return 0; const v = xs.map(x => x.ms).sort((p, q) => p - q); return Math.round(v[Math.floor(v.length / 2)] / 1000); }
